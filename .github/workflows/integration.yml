name: Integration
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: d4459c61704c23ba239638b6fc011cb7d8972607
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Prepare owned integration tests
        run: node packages/e2e/integration/prepare.mjs .tmp/lvce-integration
      - name: Install Electron
        working-directory: .tmp/lvce-integration
        run: node node_modules/electron/install.js
      - name: Run owned integration tests (Linux)
        if: runner.os == 'Linux'
        working-directory: .tmp/lvce-integration
        run: xvfb-run -a node scripts/test-process-explorer-styles.mjs
      - name: Run owned integration tests (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: .tmp/lvce-integration
        run: node scripts/test-process-explorer-styles.mjs
      - name: Test Process Explorer network service naming
        if: runner.os == 'Linux'
        working-directory: .tmp/lvce-integration
        run: xvfb-run -a node scripts/test-process-explorer-network-service.mjs
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
